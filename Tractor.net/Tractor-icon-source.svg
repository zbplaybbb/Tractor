<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="felt" cx="42%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#5EA66D"/>
      <stop offset="32%" stop-color="#32764E"/>
      <stop offset="68%" stop-color="#175037"/>
      <stop offset="100%" stop-color="#082519"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4710"/>
      <stop offset="18%" stop-color="#D6A84E"/>
      <stop offset="36%" stop-color="#FFF0AE"/>
      <stop offset="53%" stop-color="#D3A244"/>
      <stop offset="75%" stop-color="#805317"/>
      <stop offset="100%" stop-color="#F4D37A"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5218"/>
      <stop offset="23%" stop-color="#D9AD55"/>
      <stop offset="48%" stop-color="#FFF2B6"/>
      <stop offset="72%" stop-color="#B77D27"/>
      <stop offset="100%" stop-color="#F0CD75"/>
    </linearGradient>
    <linearGradient id="ivory" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#FEF8E9"/>
      <stop offset="76%" stop-color="#F3E6CD"/>
      <stop offset="100%" stop-color="#DCC8A5"/>
    </linearGradient>
    <linearGradient id="spadeFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#344A40"/>
      <stop offset="36%" stop-color="#16231E"/>
      <stop offset="100%" stop-color="#050B09"/>
    </linearGradient>
    <linearGradient id="heartFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF6370"/>
      <stop offset="28%" stop-color="#E92D40"/>
      <stop offset="72%" stop-color="#B80E25"/>
      <stop offset="100%" stop-color="#7F0617"/>
    </linearGradient>
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="33%" cy="24%" r="70%">
      <stop offset="0%" stop-color="#C7F5CF" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7AD095" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#001108" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="58%" stop-color="#001007" stop-opacity="0"/>
      <stop offset="100%" stop-color="#001007" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="feltGrain" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#FFFFFF" opacity="0.045"/>
      <circle cx="9" cy="8" r="0.55" fill="#000000" opacity="0.08"/>
      <circle cx="5" cy="11" r="0.45" fill="#FFFFFF" opacity="0.03"/>
    </pattern>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="cardShadow" x="-35%" y="-35%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="20" result="offsetblur"/>
      <feComponentTransfer in="offsetblur" result="shadow">
        <feFuncA type="linear" slope="0.62"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="56" y="56" width="912" height="912" rx="190"/>
    </clipPath>
    <clipPath id="spadeCardClip">
      <rect x="248" y="200" width="350" height="520" rx="40"/>
    </clipPath>
    <clipPath id="heartCardClip">
      <rect x="450" y="200" width="350" height="520" rx="40"/>
    </clipPath>
    <g id="spadePath">
      <use href="#heartPath" transform="translate(0 14) rotate(180 100 100)"/>
      <path d="M100 145
        C87 171 85 195 100 228
        C115 195 113 171 100 145 Z"/>
    </g>
    <path id="heartPath" d="M100 205
      C85 181 16 127 16 68
      C16 35 39 13 67 13
      C83 13 95 21 100 34
      C105 21 117 13 133 13
      C161 13 184 35 184 68
      C184 127 115 181 100 205 Z"/>
  </defs>

  <!-- Outer shadow and icon tile -->
  <rect x="66" y="80" width="892" height="892" rx="190" fill="#00150B" opacity="0.47" filter="url(#blur18)"/>
  <rect x="56" y="56" width="912" height="912" rx="190" fill="url(#felt)" stroke="url(#gold)" stroke-width="18"/>
  <g clip-path="url(#tileClip)">
    <rect x="56" y="56" width="912" height="912" fill="url(#feltGrain)"/>
    <ellipse cx="338" cy="240" rx="430" ry="310" fill="url(#tileGlow)"/>
    <ellipse cx="512" cy="512" rx="520" ry="520" fill="url(#vignette)"/>

    <!-- Subtle tractor-wheel tread ring -->
    <g fill="#03160C" opacity="0.22">
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(0 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(15 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(30 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(45 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(60 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(75 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(90 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(105 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(120 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(135 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(150 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(165 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(180 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(195 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(210 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(225 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(240 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(255 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(270 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(285 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(300 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(315 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(330 512 512)"/>
      <rect x="493" y="140" width="38" height="44" rx="12" transform="rotate(345 512 512)"/>
    </g>

    <!-- Double-ring motif for the two decks -->
    <g fill="none">
      <circle cx="385" cy="512" r="260" stroke="#001108" stroke-width="36" opacity="0.38" filter="url(#blur8)"/>
      <circle cx="639" cy="512" r="260" stroke="#001108" stroke-width="36" opacity="0.38" filter="url(#blur8)"/>
      <circle cx="385" cy="512" r="260" stroke="url(#goldRing)" stroke-width="24" opacity="0.78"/>
      <circle cx="639" cy="512" r="260" stroke="url(#goldRing)" stroke-width="24" opacity="0.78"/>
      <circle cx="385" cy="512" r="247" stroke="#FFF2B5" stroke-width="3" opacity="0.33"/>
      <circle cx="639" cy="512" r="247" stroke="#FFF2B5" stroke-width="3" opacity="0.33"/>
    </g>

    <!-- Heart card -->
    <g transform="rotate(15 625 460)" filter="url(#cardShadow)">
      <rect x="456" y="216" width="350" height="520" rx="40" fill="#604014"/>
      <rect x="452" y="208" width="350" height="520" rx="40" fill="#A9792C"/>
      <rect x="450" y="200" width="350" height="520" rx="40" fill="url(#ivory)" stroke="url(#gold)" stroke-width="12"/>
      <rect x="465" y="215" width="320" height="490" rx="30" fill="none" stroke="#E7C77A" stroke-width="3" opacity="0.92"/>
      <g clip-path="url(#heartCardClip)">
        <rect x="450" y="200" width="350" height="520" fill="url(#cardShine)" opacity="0.52"/>
        <path d="M426 200 L776 200 L608 720 L426 720 Z" fill="#FFFFFF" opacity="0.08"/>
      </g>
      <use href="#heartPath" transform="translate(530 303) scale(1.30)" fill="url(#heartFill)"/>
      <use href="#heartPath" transform="translate(484 224) scale(0.19)" fill="#C5162B"/>
      <use href="#heartPath" transform="translate(782 697) scale(0.19) rotate(180)" fill="#C5162B"/>
      <circle cx="625" cy="340" r="10" fill="#D8AE5C" opacity="0.65"/>
    </g>

    <!-- Spade card -->
    <g transform="rotate(-15 423 460)" filter="url(#cardShadow)">
      <rect x="254" y="216" width="350" height="520" rx="40" fill="#604014"/>
      <rect x="250" y="208" width="350" height="520" rx="40" fill="#A9792C"/>
      <rect x="248" y="200" width="350" height="520" rx="40" fill="url(#ivory)" stroke="url(#gold)" stroke-width="12"/>
      <rect x="263" y="215" width="320" height="490" rx="30" fill="none" stroke="#E7C77A" stroke-width="3" opacity="0.92"/>
      <g clip-path="url(#spadeCardClip)">
        <rect x="248" y="200" width="350" height="520" fill="url(#cardShine)" opacity="0.52"/>
        <path d="M248 200 L598 200 L430 720 L248 720 Z" fill="#FFFFFF" opacity="0.08"/>
      </g>
      <use href="#spadePath" transform="translate(300 303) scale(1.30)" fill="url(#spadeFill)"/>
      <use href="#spadePath" transform="translate(282 224) scale(0.19)" fill="#101B17"/>
      <use href="#spadePath" transform="translate(580 697) scale(0.19) rotate(180)" fill="#101B17"/>
      <circle cx="423" cy="340" r="10" fill="#D8AE5C" opacity="0.65"/>
    </g>

    <!-- Small light glints -->
    <g fill="#FFF8D8" opacity="0.82">
      <path d="M188 214 L197 238 L221 247 L197 256 L188 280 L179 256 L155 247 L179 238 Z"/>
      <path d="M844 690 L850 707 L867 713 L850 719 L844 736 L838 719 L821 713 L838 707 Z"/>
    </g>
    <circle cx="810" cy="244" r="7" fill="#FFF5C4" opacity="0.75"/>
    <circle cx="158" cy="720" r="6" fill="#FFF5C4" opacity="0.6"/>
  </g>

  <!-- Crisp inner bevel -->
  <rect x="78" y="78" width="868" height="868" rx="170" fill="none" stroke="#FFF6C8" stroke-width="3" opacity="0.42"/>
  <rect x="94" y="94" width="836" height="836" rx="157" fill="none" stroke="#062416" stroke-width="9" opacity="0.44"/>
</svg>
